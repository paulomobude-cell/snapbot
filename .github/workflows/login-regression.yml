name: Snapchat login regression
on:
  push:
    branches: [fix/snapchat-login-state]
  pull_request:
    branches: [main]
    paths:
      - 'snapbot.js'
      - 'server/session.js'
      - 'server/index.js'
      - 'server/accounts.js'
      - 'test/live-screen.mjs'
      - 'test/login.mjs'
      - 'test/preservation.mjs'
      - '.github/workflows/login-regression.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check snapbot.js
      - run: node --check server/session.js
      - run: node test/login.mjs
      - run: node test/live-screen.mjs
      - run: npm test
